packages:
  - packages/*
# Dependency build scripts are opt-in (pnpm fails the install on unreviewed ones).
allowBuilds:
  unrs-resolver: true
  # agent-browser: postinstall prepares the CLI binary used by the integration tests.
  agent-browser: true
  # Optional native speed-ups / unused in this repo: JS fallbacks are fine.
  esbuild: false
  cpu-features: false
  ssh2: false
  protobufjs: false
