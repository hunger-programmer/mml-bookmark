services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mml
      POSTGRES_PASSWORD: mml
      POSTGRES_DB: mml_bookmark
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mml -d mml_bookmark"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
